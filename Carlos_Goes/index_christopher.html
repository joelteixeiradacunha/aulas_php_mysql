<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page Personalizada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style> /* Reset básico de margens */
        * { margin: 0; padding: 0; box-sizing: border-box; } /* Configurações do Body */ body { background-color: #f9f5fc; font-family: 'Roboto', sans-serif; font-size: 16px; font-weight: 300; } /* Header ocupando 100% da largura total */ header { width: 100%; background-color: #aa3939; height: 90px; /* Altura ideal para o alinhamento */ /* Aplica o recuo de 10% nas laterais internas para alinhar o conteúdo */ padding: 0 10%; display: flex; justify-content: space-between; /* Separa o texto dos ícones */ align-items: center; /* Centraliza verticalmente ambos os lados */ } /* Texto do lado esquerdo do Header */ .header-titulo { font-family: 'Verdana', sans-serif; font-size: 28px; color: #ffffff; } /* Área dos ícones de mídias sociais (canto direito) */ .midias-sociais { display: flex; gap: 20px; /* Espaçamento entre os ícones */ } .midias-sociais a { color: #ffffff; font-size: 22px; text-decoration: none; transition: transform 0.2s, opacity 0.2s; } /* Efeito sutil ao passar o mouse nos ícones */ .midias-sociais a:hover { opacity: 0.8; transform: scale(1.1); } /* Container do conteúdo principal que respeita os 10% de margem lateral */ .conteudo-principal { margin: 40px 10%; } </style>
</head>
<body>
<header>
    <div class="header-titulo"> levaria cheio de ódio </div>
    <div class="midias-sociais">
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a><a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
    </div> </header> <main class="conteudo-principal"> <h1>Conteúdo da Página</h1> <p>Este parágrafo está seguindo estritamente as regras de estilo: fonte Roboto, tamanho 16px, peso (weight) 300, com margens de 10% nas laterais esquerda e direita sobre o fundo #f9f5fc.</p> </main> </body> </html>
